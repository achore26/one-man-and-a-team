<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Badge Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Precision Technical Ring -->
  <circle cx="256" cy="235" r="172" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="256" cy="235" r="160" fill="none" stroke="url(#metalGrad)" stroke-width="4" opacity="0.8"/>

  <!-- Geometric Shield / Crest -->
  <g filter="url(#subtleShadow)">
    <path d="M 256 95 
             L 365 145 
             L 365 255 
             C 365 330 256 375 256 375 
             C 256 375 147 330 147 255 
             L 147 145 Z" 
          fill="#1e293b" 
          stroke="url(#goldGrad)" 
          stroke-width="7" 
          stroke-linejoin="round" />

    <!-- Inner Crest Inset -->
    <path d="M 256 115 
             L 345 158 
             L 345 250 
             C 345 312 256 352 256 352 
             C 256 352 167 312 167 250 
             L 167 158 Z" 
          fill="#0f172a" 
          stroke="#334155" 
          stroke-width="2" />
  </g>

  <!-- Tri-Trade Technical Marks Inside Shield -->
  <!-- 1. CCTV Aperture Focus Mark (Top) -->
  <circle cx="256" cy="180" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="256" cy="180" r="14" fill="#3b82f6" opacity="0.9" />
  <line x1="256" y1="144" x2="256" y2="152" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="208" x2="256" y2="216" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="220" y1="180" x2="228" y2="180" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="284" y1="180" x2="292" y2="180" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- 2. Integrated Building Apex & Mechanical Wrench Wings -->
  <path d="M 195 285 L 256 240 L 317 285" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 215 305 L 256 275 L 297 305" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Monogram OMT -->
  <text x="256" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">OMT</text>

  <!-- Typography Brand Banner -->
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="4" fill="#ffffff" text-anchor="middle">ONE MAN &amp; A TEAM</text>
  <text x="256" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#94a3b8" text-anchor="middle">TECHNICAL CONTRACTING SERVICES</text>
</svg>
